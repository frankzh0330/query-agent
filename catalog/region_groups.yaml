# 用户说“欧洲/美国/海外”等关键词时，或 Geo Normalizer 算出 group 后，用这个映射
group_to_region_code:
  EU: EUTTP
  US: USTTP
  ROW: ROW

# 直接 region 关键词（不是国家/州），用于优先命中
region_keyword_aliases:
  EU: ["欧洲", "欧盟", "Europe", "EU", "欧区"]
  US: ["美国", "美区", "USA", "US", "United States", "U.S.", "北美"]
  ROW: ["海外", "其他海外", "其它海外", "除欧美", "其他地区", "其余海外"]

# ============================================================
# SQL Schema metadata (demo)
#
# Synthetic e-commerce analytics schema (ClickHouse dialect). No real data or
# real business definitions: table/column names are modelled after the public
# Olist e-commerce dataset structure and simplified into a star schema
# centred on `orders`.
#
# Production direction (out of scope for this demo, see README "Production Notes"):
#   - table/column/metric metadata is synced periodically from a metadata
#     service / INFORMATION_SCHEMA, then the matcher indexes are hot-reloaded
#
# Structure:
#   tables.<name>.aliases          — table aliases (fed to the inverted-index matcher)
#   tables.<name>.description      — shown to the LLM; also lists enum values of key columns
#   tables.<name>.time_column      — default target of time filters
#   tables.<name>.est_rows         — static cost estimate for the AST analyzer
#   tables.<name>.columns.<col>.aliases — column aliases
#   tables.<name>.columns.<col>.enum_values — canonical values; filter values are normalized to these
#   joins                          — declarative join graph (never guessed by the LLM)
#   metrics.<name>.expr            — business metric definition = ClickHouse aggregate expression
#
# Deliberate demo properties:
#   - Star schema around `orders`: users / products / payments / reviews join directly.
#   - `sellers` is reachable from orders only through products (2 hops), which the
#     current single-hop join inference cannot resolve. This is a known limitation.
#   - Ambiguous aliases on purpose ("amount", "time", "status", "users", "count")
#     so that the confirmation / rerank flow has something to do.
# ============================================================
schema:
  name: ecommerce
  description: E-commerce order analytics demo database (ClickHouse)

  tables:
    orders:
      aliases: ["orders", "order table", "order records", "purchases", "transactions"]
      description: "Order fact table, one row per order. status in ('created','paid','shipped','delivered','canceled','refunded'); channel in ('organic','paid_search','social','email','referral')"
      time_column: created_at
      est_rows: 80000000      # static cost estimate (in production: table stats from the metadata service)
      columns:
        order_id:
          aliases: ["order id", "order number", "order no"]
          type: "UInt64"
        user_id:
          aliases: ["user id", "customer id", "buyer id"]
          type: "UInt64"
        product_id:
          aliases: ["product id", "item id", "sku"]
          type: "UInt32"
        amount:
          aliases: ["amount", "order amount", "order value", "total"]
          type: "Float64"
        freight:
          aliases: ["freight", "shipping fee", "shipping cost", "delivery fee"]
          type: "Float64"
        status:
          aliases: ["status", "order status", "state"]
          type: "LowCardinality(String)"
          enum_values: ["created", "paid", "shipped", "delivered", "canceled", "refunded"]
        channel:
          aliases: ["channel", "traffic source", "acquisition channel", "source"]
          type: "LowCardinality(String)"
          enum_values: ["organic", "paid_search", "social", "email", "referral"]
        created_at:
          aliases: ["order time", "order date", "created time", "time", "date"]
          type: "DateTime"

    users:
      aliases: ["users", "user table", "customers", "members", "buyers"]
      description: "User dimension table. vip_level in ('bronze','silver','gold','platinum')"
      time_column: registered_at
      est_rows: 2000000
      columns:
        id:
          aliases: ["user id", "customer id"]
          type: "UInt64"
        region:
          aliases: ["region", "area", "country", "location"]
          type: "LowCardinality(String)"
        city:
          aliases: ["city", "town"]
          type: "LowCardinality(String)"
        vip_level:
          aliases: ["vip level", "membership level", "member tier", "loyalty tier", "tier"]
          type: "LowCardinality(String)"
          enum_values: ["bronze", "silver", "gold", "platinum"]
        registered_at:
          aliases: ["registration time", "signup date", "registered time", "signup time"]
          type: "DateTime"

    products:
      aliases: ["products", "product table", "items", "catalog items", "goods"]
      description: "Product dimension table, one row per product"
      est_rows: 50000
      columns:
        id:
          aliases: ["product id", "item id"]
          type: "UInt32"
        category:
          aliases: ["category", "product category", "product type", "department"]
          type: "LowCardinality(String)"
        brand:
          aliases: ["brand", "manufacturer"]
          type: "LowCardinality(String)"
        price:
          aliases: ["price", "unit price", "list price", "selling price"]
          type: "Float64"
        seller_id:
          aliases: ["seller id", "merchant id", "vendor id"]
          type: "UInt32"

    payments:
      aliases: ["payments", "payment table", "payment records", "transactions log"]
      description: "Payment fact table, one row per payment of an order. payment_type in ('credit_card','debit_card','wallet','bank_transfer')"
      time_column: paid_at
      est_rows: 90000000
      columns:
        payment_id:
          aliases: ["payment id"]
          type: "UInt64"
        order_id:
          aliases: ["order id", "order number"]
          type: "UInt64"
        payment_type:
          aliases: ["payment type", "payment method", "payment mode", "pay method"]
          type: "LowCardinality(String)"
          enum_values: ["credit_card", "debit_card", "wallet", "bank_transfer"]
        amount:
          aliases: ["amount", "payment amount", "paid amount", "paid value"]
          type: "Float64"
        installments:
          aliases: ["installments", "instalments", "number of installments"]
          type: "UInt8"
        paid_at:
          aliases: ["payment time", "paid time", "payment date", "time", "date"]
          type: "DateTime"

    reviews:
      aliases: ["reviews", "review table", "ratings", "feedback", "customer reviews"]
      description: "Order review fact table, one row per review. rating is an integer 1-5"
      time_column: created_at
      est_rows: 30000000
      columns:
        review_id:
          aliases: ["review id"]
          type: "UInt64"
        order_id:
          aliases: ["order id", "order number"]
          type: "UInt64"
        rating:
          aliases: ["rating", "score", "stars", "review score"]
          type: "UInt8"
        created_at:
          aliases: ["review time", "review date", "time", "date"]
          type: "DateTime"

    sellers:
      aliases: ["sellers", "seller table", "merchants", "vendors", "shops"]
      description: "Seller dimension table"
      est_rows: 20000
      columns:
        id:
          aliases: ["seller id", "merchant id"]
          type: "UInt32"
        region:
          aliases: ["seller region", "merchant region", "seller location"]
          type: "LowCardinality(String)"
        joined_at:
          aliases: ["seller join date", "onboarding date"]
          type: "DateTime"

  joins:
    - left: orders
      right: users
      condition: "orders.user_id = users.id"
    - left: orders
      right: products
      condition: "orders.product_id = products.id"
    - left: orders
      right: payments
      condition: "orders.order_id = payments.order_id"
    - left: orders
      right: reviews
      condition: "orders.order_id = reviews.order_id"
    - left: products
      right: sellers
      condition: "products.seller_id = sellers.id"

  metrics:
    revenue:
      aliases: ["revenue", "sales", "gmv", "sales amount", "turnover", "gross merchandise value"]
      expr: "sum(orders.amount)"
      table: orders            # owning table (basis for main-table inference of count()-style exprs)
      description: Total order amount
    order_count:
      aliases: ["order count", "number of orders", "orders count", "order volume", "total orders"]
      expr: "count()"
      table: orders
      description: Number of orders
    avg_order_value:
      aliases: ["average order value", "aov", "avg order value", "average order amount", "average basket"]
      expr: "avg(orders.amount)"
      table: orders
      description: Average order amount
    buyer_count:
      aliases: ["buyer count", "number of buyers", "unique buyers", "paying users", "customers who ordered"]
      expr: "uniqExact(orders.user_id)"
      table: orders
      description: Distinct users who placed an order
    cancel_rate:
      aliases: ["cancel rate", "cancellation rate", "canceled order rate", "order cancel ratio"]
      expr: "countIf(orders.status = 'canceled') / count()"
      table: orders
      description: Share of orders in status canceled
    refund_rate:
      aliases: ["refund rate", "refunded order rate", "return rate", "order refund ratio"]
      expr: "countIf(orders.status = 'refunded') / count()"
      table: orders
      description: Share of orders in status refunded
    avg_freight:
      aliases: ["average freight", "avg shipping fee", "average shipping cost", "average delivery fee"]
      expr: "avg(orders.freight)"
      table: orders
      description: Average freight per order
    products_sold:
      aliases: ["products sold", "number of products sold", "distinct products ordered", "active products"]
      expr: "uniqExact(orders.product_id)"
      table: orders
      description: Distinct products that appear in orders
    payment_amount:
      aliases: ["payment amount", "total payments", "paid amount", "amount paid", "payment volume"]
      expr: "sum(payments.amount)"
      table: payments
      description: Total amount of payments received
    avg_installments:
      aliases: ["average installments", "avg installments", "average number of installments"]
      expr: "avg(payments.installments)"
      table: payments
      description: Average number of installments per payment
    avg_rating:
      aliases: ["average rating", "avg rating", "average review score", "mean rating", "average stars"]
      expr: "avg(reviews.rating)"
      table: reviews
      description: Average review rating
    review_count:
      aliases: ["review count", "number of reviews", "total reviews", "reviews received"]
      expr: "count()"
      table: reviews
      description: Number of reviews
    positive_review_rate:
      aliases: ["positive review rate", "good review rate", "satisfaction rate", "share of positive reviews"]
      expr: "countIf(reviews.rating >= 4) / count()"
      table: reviews
      description: Share of reviews with rating 4 or 5
    new_user_count:
      aliases: ["new users", "new user count", "signups", "new registrations", "number of signups"]
      expr: "count()"
      table: users
      description: Number of newly registered users

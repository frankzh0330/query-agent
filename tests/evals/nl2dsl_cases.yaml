cases:
  - name: basic_new_query
    steps:
      - text: 查询近7天 app_launch 的PV
        project_id: 55
        extraction:
          metric_extractions: ["PV"]
          event_extractions: ["app_launch"]
          region_filter: ["ROW"]
          group_by_extractions: ["country"]
        resolver: high_confidence
        expect:
          status: success
          turn_mode: new_query
          semantic:
            event: app_launch
            metric: pv
            region_filter: ["ROW"]
            group_by: ["country"]

  - name: followup_change_time
    setup:
      last_query_state:
        project_id: 55
        event: app_launch
        metric: pv
        time_range:
          type: last_n_days
          n: 7
        region_filter: ["ROW"]
        group_by: ["country"]
        filters: []
        turn_type: new_query
    steps:
      - text: 昨天
        project_id: 55
        extraction:
          time_extractions: ["昨天"]
          region_filter: ["ROW"]
        resolver: time_yesterday
        expect:
          status: success
          turn_mode: followup_patch
          semantic:
            event: app_launch
            metric: pv
            time_n: 1
            region_filter: ["ROW"]
            group_by: ["country"]

  - name: followup_change_metric
    setup:
      last_query_state:
        project_id: 55
        event: app_launch
        metric: pv
        time_range:
          type: last_n_days
          n: 7
        region_filter: ["ROW"]
        group_by: ["country"]
        filters: []
        turn_type: new_query
    steps:
      - text: 改成UV
        project_id: 55
        extraction:
          metric_extractions: ["UV"]
          region_filter: ["ROW"]
        resolver: metric_uv
        expect:
          status: success
          turn_mode: followup_patch
          semantic:
            event: app_launch
            metric: uv
            region_filter: ["ROW"]
            group_by: ["country"]

  - name: followup_confirmation_flow
    setup:
      last_query_state:
        project_id: 55
        event: app_launch
        metric: pv
        time_range:
          type: last_n_days
          n: 7
        region_filter: ["ROW"]
        group_by: ["country"]
        filters: []
        turn_type: new_query
    steps:
      - text: 对比 purchase
        project_id: 55
        extraction:
          event_extractions: ["purchase"]
          region_filter: ["ROW"]
        resolver: low_confidence_event
        expect:
          status: needs_confirmation
          turn_mode: followup_patch
          candidates_contains: event
      - text: "1"
        project_id: 55
        expect:
          status: success
          turn_mode: confirmation
          semantic:
            event: purchase_success
            metric: pv
            region_filter: ["ROW"]
            group_by: ["country"]

  - name: project_memory_context_injected
    setup:
      project_memory:
        project_id: 55
        entries:
          - filename: aliases.md
            content: |
              在 project_55 中，“激活”默认映射 activation_success。
    steps:
      - text: 看激活数据
        project_id: 55
        extraction:
          event_extractions: ["activation_success"]
          region_filter: ["ROW"]
        resolver: project_memory_alias
        assert_memory_contains: "激活"
        expect:
          status: success
          turn_mode: new_query
          semantic:
            event: activation_success
            metric: pv
            region_filter: ["ROW"]
            group_by: ["country"]

  - name: confirmation_after_restart
    steps:
      - text: purchase的情况
        project_id: 55
        extraction:
          event_extractions: ["purchase"]
          region_filter: ["ROW"]
        resolver: low_confidence_event
        expect:
          status: needs_confirmation
          candidates_contains: event
      - text: "1"
        project_id: 55
        restart_before: true
        expect:
          status: success
          turn_mode: confirmation
          semantic:
            event: purchase_success
            metric: pv
            region_filter: ["ROW"]
            group_by: ["country"]
